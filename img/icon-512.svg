<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg512" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="cup512" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)"/>
  <!-- Subtle gradient overlay -->
  <rect width="512" height="512" rx="112" fill="url(#bg512)" opacity="0.5"/>

  <!-- Headband arc -->
  <path d="M 138 295 Q 134 118 256 96 Q 378 118 374 295"
        fill="none" stroke="#3a3a3a" stroke-width="28" stroke-linecap="round"/>
  <!-- Headband shine -->
  <path d="M 146 290 Q 142 126 256 106 Q 370 126 366 290"
        fill="none" stroke="white" stroke-width="10" stroke-linecap="round" opacity="0.06"/>
  <!-- Center pad -->
  <path d="M 200 112 Q 256 94 312 112"
        fill="none" stroke="#222" stroke-width="18" stroke-linecap="round"/>

  <!-- Slider left -->
  <rect x="124" y="278" width="26" height="50" rx="7" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <rect x="129" y="287" width="16" height="7" rx="3" fill="#333"/>
  <rect x="129" y="298" width="16" height="7" rx="3" fill="#2a2a2a"/>
  <rect x="129" y="309" width="16" height="7" rx="3" fill="#222"/>

  <!-- Slider right -->
  <rect x="362" y="278" width="26" height="50" rx="7" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
  <rect x="367" y="287" width="16" height="7" rx="3" fill="#333"/>
  <rect x="367" y="298" width="16" height="7" rx="3" fill="#2a2a2a"/>
  <rect x="367" y="309" width="16" height="7" rx="3" fill="#222"/>

  <!-- Left earcup -->
  <ellipse cx="148" cy="360" rx="72" ry="84" fill="url(#cup512)"/>
  <ellipse cx="148" cy="360" rx="72" ry="84" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="148" cy="360" rx="60" ry="71" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <ellipse cx="148" cy="360" rx="40" ry="48" fill="#111"/>
  <ellipse cx="148" cy="360" rx="24" ry="29" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
  <ellipse cx="148" cy="360" rx="10" ry="12" fill="#080808"/>
  <!-- Left accent -->
  <circle cx="186" cy="330" r="7" fill="#904745" opacity="0.95"/>
  <circle cx="186" cy="330" r="11" fill="#904745" opacity="0.15"/>
  <!-- Left shine -->
  <ellipse cx="124" cy="334" rx="26" ry="14" fill="white" opacity="0.05" transform="rotate(-20,124,334)"/>

  <!-- Right earcup -->
  <ellipse cx="364" cy="360" rx="72" ry="84" fill="url(#cup512)"/>
  <ellipse cx="364" cy="360" rx="72" ry="84" fill="none" stroke="#333" stroke-width="2"/>
  <ellipse cx="364" cy="360" rx="60" ry="71" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1"/>
  <ellipse cx="364" cy="360" rx="40" ry="48" fill="#111"/>
  <ellipse cx="364" cy="360" rx="24" ry="29" fill="#0d0d0d" stroke="#222" stroke-width="1"/>
  <ellipse cx="364" cy="360" rx="10" ry="12" fill="#080808"/>
  <!-- Right accent -->
  <circle cx="402" cy="330" r="7" fill="#904745" opacity="0.95"/>
  <circle cx="402" cy="330" r="11" fill="#904745" opacity="0.15"/>
  <!-- Right shine -->
  <ellipse cx="340" cy="334" rx="26" ry="14" fill="white" opacity="0.05" transform="rotate(-20,340,334)"/>

  <!-- Brand text -->
  <text x="256" y="470" text-anchor="middle" font-family="Inter,Arial,sans-serif"
        font-size="28" font-weight="700" fill="#904745" letter-spacing="8">RAZOR</text>
  <text x="256" y="496" text-anchor="middle" font-family="Inter,Arial,sans-serif"
        font-size="13" font-weight="400" fill="#555" letter-spacing="10">AUDIO</text>
</svg>
