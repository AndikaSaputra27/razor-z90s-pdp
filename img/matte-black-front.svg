<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="bg-mb-f" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="cup-mb-f" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#3a3a3a"/>
      <stop offset="60%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="pad-mb-f" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2e2e2e"/>
      <stop offset="100%" stop-color="#111"/>
    </radialGradient>
    <radialGradient id="inner-mb-f" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#444"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </radialGradient>
    <filter id="shadow-mb-f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="band-mb-f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="50%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#2a2a2a"/>
    </linearGradient>
    <linearGradient id="shine-mb-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="420" fill="url(#bg-mb-f)" rx="20"/>

  <g filter="url(#shadow-mb-f)">
    <!-- Headband arc -->
    <path d="M 110 210 Q 108 80 200 65 Q 292 80 290 210"
          fill="none" stroke="url(#band-mb-f)" stroke-width="22" stroke-linecap="round"/>
    <!-- Headband shine -->
    <path d="M 116 210 Q 114 90 200 76 Q 286 90 284 210"
          fill="none" stroke="url(#shine-mb-f)" stroke-width="18" stroke-linecap="round"/>

    <!-- Headband padding center -->
    <path d="M 155 90 Q 200 72 245 90"
          fill="none" stroke="#222" stroke-width="14" stroke-linecap="round"/>

    <!-- Slider left -->
    <rect x="100" y="195" width="20" height="38" rx="5" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
    <rect x="103" y="200" width="14" height="6" rx="2" fill="#333"/>
    <rect x="103" y="210" width="14" height="6" rx="2" fill="#2a2a2a"/>

    <!-- Slider right -->
    <rect x="280" y="195" width="20" height="38" rx="5" fill="#1e1e1e" stroke="#333" stroke-width="1"/>
    <rect x="283" y="200" width="14" height="6" rx="2" fill="#333"/>
    <rect x="283" y="210" width="14" height="6" rx="2" fill="#2a2a2a"/>

    <!-- Left earcup -->
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="url(#cup-mb-f)"/>
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Left ear pad ring -->
    <ellipse cx="115" cy="270" rx="50" ry="59" fill="url(#pad-mb-f)" stroke="#3a3a3a" stroke-width="1"/>
    <!-- Left inner driver -->
    <ellipse cx="115" cy="270" rx="34" ry="40" fill="url(#inner-mb-f)"/>
    <ellipse cx="115" cy="270" rx="22" ry="26" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
    <ellipse cx="115" cy="270" rx="10" ry="12" fill="#0d0d0d"/>
    <!-- Left logo dot -->
    <circle cx="143" cy="248" r="4" fill="#904745" opacity="0.9"/>
    <!-- Left shine -->
    <ellipse cx="100" cy="250" rx="18" ry="10" fill="white" opacity="0.04" transform="rotate(-20,100,250)"/>

    <!-- Right earcup -->
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="url(#cup-mb-f)"/>
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="none" stroke="#333" stroke-width="1.5"/>
    <!-- Right ear pad ring -->
    <ellipse cx="285" cy="270" rx="50" ry="59" fill="url(#pad-mb-f)" stroke="#3a3a3a" stroke-width="1"/>
    <!-- Right inner driver -->
    <ellipse cx="285" cy="270" rx="34" ry="40" fill="url(#inner-mb-f)"/>
    <ellipse cx="285" cy="270" rx="22" ry="26" fill="#111" stroke="#2a2a2a" stroke-width="1"/>
    <ellipse cx="285" cy="270" rx="10" ry="12" fill="#0d0d0d"/>
    <!-- Right button -->
    <circle cx="313" cy="248" r="4" fill="#904745" opacity="0.9"/>
    <!-- Right shine -->
    <ellipse cx="270" cy="250" rx="18" ry="10" fill="white" opacity="0.04" transform="rotate(-20,270,250)"/>
  </g>

  <!-- Label -->
  <text x="200" y="390" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#555" letter-spacing="2">MATTE BLACK</text>
  <text x="200" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#444" letter-spacing="1">FRONT VIEW</text>
</svg>
