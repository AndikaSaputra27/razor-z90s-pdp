<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="bg-bl-f" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </radialGradient>
    <radialGradient id="cup-bl-f" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2a4878"/>
      <stop offset="55%" stop-color="#1a3060"/>
      <stop offset="100%" stop-color="#0e1e40"/>
    </radialGradient>
    <radialGradient id="pad-bl-f" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#1e3868"/>
      <stop offset="100%" stop-color="#0e1e48"/>
    </radialGradient>
    <radialGradient id="inner-bl-f" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#243e70"/>
      <stop offset="100%" stop-color="#0e1e48"/>
    </radialGradient>
    <filter id="shadow-bl-f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#051020" flood-opacity="0.7"/>
    </filter>
    <linearGradient id="band-bl-f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3060"/>
      <stop offset="50%" stop-color="#2a4878"/>
      <stop offset="100%" stop-color="#1a3060"/>
    </linearGradient>
    <linearGradient id="shine-bl-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="420" fill="url(#bg-bl-f)" rx="20"/>

  <g filter="url(#shadow-bl-f)">
    <!-- Headband -->
    <path d="M 110 210 Q 108 80 200 65 Q 292 80 290 210"
          fill="none" stroke="url(#band-bl-f)" stroke-width="22" stroke-linecap="round"/>
    <path d="M 116 205 Q 114 88 200 74 Q 286 88 284 205"
          fill="none" stroke="url(#shine-bl-f)" stroke-width="12" stroke-linecap="round"/>

    <!-- Center pad -->
    <path d="M 157 89 Q 200 73 243 89"
          fill="none" stroke="#162850" stroke-width="14" stroke-linecap="round"/>

    <!-- Slider left -->
    <rect x="100" y="195" width="20" height="38" rx="5" fill="#162850" stroke="#243870" stroke-width="1"/>
    <rect x="103" y="200" width="14" height="6" rx="2" fill="#1e3868"/>
    <rect x="103" y="210" width="14" height="6" rx="2" fill="#162858"/>

    <!-- Slider right -->
    <rect x="280" y="195" width="20" height="38" rx="5" fill="#162850" stroke="#243870" stroke-width="1"/>
    <rect x="283" y="200" width="14" height="6" rx="2" fill="#1e3868"/>
    <rect x="283" y="210" width="14" height="6" rx="2" fill="#162858"/>

    <!-- Left earcup -->
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="url(#cup-bl-f)"/>
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="none" stroke="#243870" stroke-width="1.5"/>
    <ellipse cx="115" cy="270" rx="50" ry="59" fill="url(#pad-bl-f)" stroke="#1e3060" stroke-width="1"/>
    <ellipse cx="115" cy="270" rx="34" ry="40" fill="url(#inner-bl-f)"/>
    <ellipse cx="115" cy="270" rx="22" ry="26" fill="#0e1e48" stroke="#1a2e60" stroke-width="1"/>
    <ellipse cx="115" cy="270" rx="10" ry="12" fill="#0a1630"/>
    <circle cx="143" cy="248" r="4" fill="#4a7fd4" opacity="0.95"/>
    <ellipse cx="98" cy="248" rx="18" ry="10" fill="white" opacity="0.07" transform="rotate(-20,98,248)"/>

    <!-- Right earcup -->
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="url(#cup-bl-f)"/>
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="none" stroke="#243870" stroke-width="1.5"/>
    <ellipse cx="285" cy="270" rx="50" ry="59" fill="url(#pad-bl-f)" stroke="#1e3060" stroke-width="1"/>
    <ellipse cx="285" cy="270" rx="34" ry="40" fill="url(#inner-bl-f)"/>
    <ellipse cx="285" cy="270" rx="22" ry="26" fill="#0e1e48" stroke="#1a2e60" stroke-width="1"/>
    <ellipse cx="285" cy="270" rx="10" ry="12" fill="#0a1630"/>
    <circle cx="313" cy="248" r="4" fill="#4a7fd4" opacity="0.95"/>
    <ellipse cx="268" cy="248" rx="18" ry="10" fill="white" opacity="0.07" transform="rotate(-20,268,248)"/>
  </g>

  <text x="200" y="390" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#4a7fd4" letter-spacing="2">MATTE BLUE</text>
  <text x="200" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#3a60a8" letter-spacing="1">FRONT VIEW</text>
</svg>
