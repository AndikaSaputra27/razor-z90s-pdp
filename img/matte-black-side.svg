<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="bg-mb-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>
    <radialGradient id="cup-mb-s" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#3d3d3d"/>
      <stop offset="55%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <linearGradient id="band-mb-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#333"/>
      <stop offset="50%" stop-color="#3d3d3d"/>
      <stop offset="100%" stop-color="#222"/>
    </linearGradient>
    <filter id="shadow-mb-s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="14" flood-color="#000" flood-opacity="0.65"/>
    </filter>
    <linearGradient id="arm-mb-s" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>

  <rect width="400" height="420" fill="url(#bg-mb-s)" rx="20"/>

  <g filter="url(#shadow-mb-s)">
    <!-- Headband side arc -->
    <path d="M 175 310 Q 130 290 125 220 Q 120 130 200 90 Q 270 75 295 150"
          fill="none" stroke="url(#band-mb-s)" stroke-width="20" stroke-linecap="round"/>

    <!-- Headband top padding -->
    <path d="M 190 96 Q 240 78 285 155"
          fill="none" stroke="#1e1e1e" stroke-width="13" stroke-linecap="round"/>

    <!-- Arm / slider -->
    <rect x="160" y="295" width="18" height="42" rx="5"
          fill="url(#arm-mb-s)" stroke="#333" stroke-width="1"/>
    <rect x="163" y="302" width="12" height="5" rx="2" fill="#444"/>
    <rect x="163" y="311" width="12" height="5" rx="2" fill="#333"/>
    <rect x="163" y="320" width="12" height="5" rx="2" fill="#2a2a2a"/>

    <!-- Earcup body (side profile - oval) -->
    <ellipse cx="185" cy="340" rx="72" ry="52" fill="url(#cup-mb-s)" transform="rotate(-8,185,340)"/>
    <ellipse cx="185" cy="340" rx="72" ry="52" fill="none" stroke="#333" stroke-width="1.5" transform="rotate(-8,185,340)"/>

    <!-- Ear pad (side) -->
    <ellipse cx="185" cy="340" rx="63" ry="44" fill="#1a1a1a" stroke="#2e2e2e" stroke-width="1" transform="rotate(-8,185,340)"/>

    <!-- Speaker grille detail -->
    <ellipse cx="185" cy="340" rx="46" ry="32" fill="#111" transform="rotate(-8,185,340)"/>
    <line x1="166" y1="324" x2="204" y2="356" stroke="#222" stroke-width="1" opacity="0.8"/>
    <line x1="166" y1="332" x2="204" y2="364" stroke="#222" stroke-width="1" opacity="0.6"/>
    <line x1="166" y1="316" x2="204" y2="348" stroke="#222" stroke-width="1" opacity="0.4"/>
    <line x1="174" y1="318" x2="156" y2="348" stroke="#222" stroke-width="1" opacity="0.5"/>
    <line x1="182" y1="316" x2="164" y2="346" stroke="#222" stroke-width="1" opacity="0.4"/>

    <!-- USB-C port -->
    <rect x="220" y="356" width="14" height="5" rx="2" fill="#0d0d0d" stroke="#333" stroke-width="0.5"/>

    <!-- Logo accent -->
    <circle cx="215" cy="320" r="5" fill="#904745" opacity="0.9"/>

    <!-- Shine -->
    <ellipse cx="162" cy="322" rx="20" ry="12" fill="white" opacity="0.05" transform="rotate(-8,162,322)"/>

    <!-- ANC mic dot -->
    <circle cx="148" cy="350" r="3" fill="#222" stroke="#444" stroke-width="1"/>
  </g>

  <text x="200" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#555" letter-spacing="2">MATTE BLACK</text>
  <text x="200" y="416" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#444" letter-spacing="1">SIDE VIEW</text>
</svg>
