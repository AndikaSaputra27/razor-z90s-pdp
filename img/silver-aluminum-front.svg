<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="bg-sl-f" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#dde4ea"/>
      <stop offset="100%" stop-color="#b8c4cc"/>
    </radialGradient>
    <radialGradient id="cup-sl-f" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#e8eef2"/>
      <stop offset="50%" stop-color="#c0cdd6"/>
      <stop offset="100%" stop-color="#8fa0ae"/>
    </radialGradient>
    <radialGradient id="pad-sl-f" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#d0dae0"/>
      <stop offset="100%" stop-color="#9aaab5"/>
    </radialGradient>
    <radialGradient id="inner-sl-f" cx="40%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#c8d4dc"/>
      <stop offset="100%" stop-color="#7a8f9e"/>
    </radialGradient>
    <filter id="shadow-sl-f" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6a8090" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="band-sl-f" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b0bec8"/>
      <stop offset="30%" stop-color="#d8e2e8"/>
      <stop offset="70%" stop-color="#d8e2e8"/>
      <stop offset="100%" stop-color="#b0bec8"/>
    </linearGradient>
    <linearGradient id="shine-sl-f" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="400" height="420" fill="url(#bg-sl-f)" rx="20"/>

  <g filter="url(#shadow-sl-f)">
    <!-- Headband -->
    <path d="M 110 210 Q 108 80 200 65 Q 292 80 290 210"
          fill="none" stroke="url(#band-sl-f)" stroke-width="22" stroke-linecap="round"/>
    <!-- Shine on band -->
    <path d="M 116 205 Q 114 88 200 74 Q 286 88 284 205"
          fill="none" stroke="url(#shine-sl-f)" stroke-width="10" stroke-linecap="round"/>

    <!-- Headband center pad -->
    <path d="M 158 88 Q 200 72 242 88"
          fill="none" stroke="#b8c8d4" stroke-width="13" stroke-linecap="round"/>

    <!-- Slider left -->
    <rect x="100" y="195" width="20" height="38" rx="5" fill="#c8d4dc" stroke="#a8b8c4" stroke-width="1"/>
    <rect x="103" y="200" width="14" height="6" rx="2" fill="#d8e4ea"/>
    <rect x="103" y="210" width="14" height="6" rx="2" fill="#c0ccd8"/>

    <!-- Slider right -->
    <rect x="280" y="195" width="20" height="38" rx="5" fill="#c8d4dc" stroke="#a8b8c4" stroke-width="1"/>
    <rect x="283" y="200" width="14" height="6" rx="2" fill="#d8e4ea"/>
    <rect x="283" y="210" width="14" height="6" rx="2" fill="#c0ccd8"/>

    <!-- Left earcup -->
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="url(#cup-sl-f)"/>
    <ellipse cx="115" cy="270" rx="58" ry="68" fill="none" stroke="#a8b8c4" stroke-width="1.5"/>
    <ellipse cx="115" cy="270" rx="50" ry="59" fill="url(#pad-sl-f)" stroke="#b0c0cc" stroke-width="1"/>
    <ellipse cx="115" cy="270" rx="34" ry="40" fill="url(#inner-sl-f)"/>
    <ellipse cx="115" cy="270" rx="22" ry="26" fill="#98aab6" stroke="#b0c0cc" stroke-width="1"/>
    <ellipse cx="115" cy="270" rx="10" ry="12" fill="#8090a0"/>
    <circle cx="143" cy="248" r="4" fill="#5a7a8a" opacity="0.9"/>
    <!-- Metallic shine on cup -->
    <ellipse cx="98" cy="248" rx="20" ry="12" fill="white" opacity="0.25" transform="rotate(-20,98,248)"/>

    <!-- Right earcup -->
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="url(#cup-sl-f)"/>
    <ellipse cx="285" cy="270" rx="58" ry="68" fill="none" stroke="#a8b8c4" stroke-width="1.5"/>
    <ellipse cx="285" cy="270" rx="50" ry="59" fill="url(#pad-sl-f)" stroke="#b0c0cc" stroke-width="1"/>
    <ellipse cx="285" cy="270" rx="34" ry="40" fill="url(#inner-sl-f)"/>
    <ellipse cx="285" cy="270" rx="22" ry="26" fill="#98aab6" stroke="#b0c0cc" stroke-width="1"/>
    <ellipse cx="285" cy="270" rx="10" ry="12" fill="#8090a0"/>
    <circle cx="313" cy="248" r="4" fill="#5a7a8a" opacity="0.9"/>
    <ellipse cx="268" cy="248" rx="20" ry="12" fill="white" opacity="0.25" transform="rotate(-20,268,248)"/>
  </g>

  <text x="200" y="390" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#5a7a8a" letter-spacing="2">SILVER ALUMINUM</text>
  <text x="200" y="408" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#7a90a0" letter-spacing="1">FRONT VIEW</text>
</svg>
