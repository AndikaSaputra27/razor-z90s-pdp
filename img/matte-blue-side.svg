<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" width="400" height="420">
  <defs>
    <radialGradient id="bg-bl-s" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a2a4a"/>
      <stop offset="100%" stop-color="#0a1428"/>
    </radialGradient>
    <radialGradient id="cup-bl-s" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2e5090"/>
      <stop offset="55%" stop-color="#1a3268"/>
      <stop offset="100%" stop-color="#0e1e44"/>
    </radialGradient>
    <linearGradient id="band-bl-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3060"/>
      <stop offset="50%" stop-color="#2a4880"/>
      <stop offset="100%" stop-color="#162850"/>
    </linearGradient>
    <filter id="shadow-bl-s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="14" flood-color="#051020" flood-opacity="0.7"/>
    </filter>
  </defs>

  <rect width="400" height="420" fill="url(#bg-bl-s)" rx="20"/>

  <g filter="url(#shadow-bl-s)">
    <!-- Headband arc side -->
    <path d="M 175 310 Q 130 290 125 220 Q 120 130 200 90 Q 270 75 295 150"
          fill="none" stroke="url(#band-bl-s)" stroke-width="20" stroke-linecap="round"/>
    <!-- Shine -->
    <path d="M 178 308 Q 134 288 129 218 Q 124 132 202 94"
          fill="none" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.08"/>

    <!-- Top pad -->
    <path d="M 192 96 Q 242 80 287 157"
          fill="none" stroke="#142248" stroke-width="13" stroke-linecap="round"/>

    <!-- Slider arm -->
    <rect x="160" y="295" width="18" height="42" rx="5" fill="#162850" stroke="#243870" stroke-width="1"/>
    <rect x="163" y="302" width="12" height="5" rx="2" fill="#1e3868"/>
    <rect x="163" y="311" width="12" height="5" rx="2" fill="#162858"/>
    <rect x="163" y="320" width="12" height="5" rx="2" fill="#101e48"/>

    <!-- Earcup side -->
    <ellipse cx="185" cy="340" rx="72" ry="52" fill="url(#cup-bl-s)" transform="rotate(-8,185,340)"/>
    <ellipse cx="185" cy="340" rx="72" ry="52" fill="none" stroke="#243870" stroke-width="1.5" transform="rotate(-8,185,340)"/>
    <ellipse cx="185" cy="340" rx="63" ry="44" fill="#162858" stroke="#1e3068" stroke-width="1" transform="rotate(-8,185,340)"/>

    <!-- Speaker grille -->
    <ellipse cx="185" cy="340" rx="46" ry="32" fill="#0e1e44" transform="rotate(-8,185,340)"/>
    <line x1="166" y1="324" x2="204" y2="356" stroke="#243870" stroke-width="1" opacity="0.7"/>
    <line x1="166" y1="332" x2="204" y2="364" stroke="#243870" stroke-width="1" opacity="0.5"/>
    <line x1="166" y1="316" x2="204" y2="348" stroke="#243870" stroke-width="1" opacity="0.4"/>
    <line x1="174" y1="318" x2="156" y2="348" stroke="#243870" stroke-width="1" opacity="0.5"/>

    <!-- USB-C -->
    <rect x="220" y="356" width="14" height="5" rx="2" fill="#0a1428" stroke="#243870" stroke-width="0.5"/>

    <!-- Accent glow dot -->
    <circle cx="215" cy="320" r="5" fill="#4a7fd4" opacity="0.95"/>
    <circle cx="215" cy="320" r="8" fill="#4a7fd4" opacity="0.15"/>

    <!-- Shine -->
    <ellipse cx="158" cy="320" rx="22" ry="14" fill="white" opacity="0.07" transform="rotate(-8,158,320)"/>

    <!-- ANC mic -->
    <circle cx="148" cy="350" r="3" fill="#1a2e58" stroke="#243870" stroke-width="1"/>
  </g>

  <text x="200" y="400" text-anchor="middle" font-family="Inter,sans-serif" font-size="13" font-weight="600" fill="#4a7fd4" letter-spacing="2">MATTE BLUE</text>
  <text x="200" y="416" text-anchor="middle" font-family="Inter,sans-serif" font-size="10" fill="#3a60a8" letter-spacing="1">SIDE VIEW</text>
</svg>
