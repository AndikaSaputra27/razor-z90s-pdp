<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline &mdash; Razor Audio</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: #0d0d0d; color: #e0e0e0;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem; text-align: center; gap: 1.5rem;
    }
    .logo { font-size: 1.75rem; font-weight: 700; letter-spacing: .06em; }
    .logo span { color: #904745; }
    .icon { color: #904745; margin-bottom: .5rem; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    p  { font-size: .9375rem; color: #777; line-height: 1.7; max-width: 360px; }
    .btn {
      margin-top: .5rem; padding: .875rem 2rem;
      background: #904745; color: #fff;
      border: none; border-radius: 999px;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      text-decoration: none; display: inline-block;
      transition: background .2s ease;
    }
    .btn:hover { background: #6e3432; }
  </style>
</head>
<body>
  <div class="logo">RAZOR <span>AUDIO</span></div>
  <div class="icon">
    <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/>
      <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
      <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
      <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
      <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
      <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
      <line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>Kamu sedang offline</h1>
  <p>Periksa koneksi internet kamu dan coba lagi. Halaman yang pernah dikunjungi mungkin masih tersedia dari cache.</p>
  <button class="btn" onclick="window.location.reload()">Coba Lagi</button>
  <a href="/razor-z90s-pdp/" class="btn" style="background:#1a1a1a;border:1.5px solid #333;">Beranda</a>
</body>
</html>
